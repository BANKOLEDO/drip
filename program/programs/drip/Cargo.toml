[package]
name = "drip"
version = "0.1.0"
description = "Drip DCA guard: intent PDA + pause flag + scaled-share receipts. Never swaps, never holds custody."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "drip"

[features]
no-entrypoint = []
no-idl = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "1.2.0"
anchor-spl = "1.2.0"
spl-token-2022 = { version = "7.0.0", default-features = false, features = ["zk-ops", "no-entrypoint"] }
